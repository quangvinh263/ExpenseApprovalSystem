name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore ExpenseApproval.slnx

      - name: Build solution
        run: dotnet build ExpenseApproval.slnx --no-restore

      - name: Run tests
        run: dotnet test ExpenseApproval.slnx --no-restore
